name: Publish Dutch C1.2 offline course
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Restore and verify complete course
        run: |
          cat course.zip.part* > course.zip
          sha256sum -c course.sha256
          unzip -q course.zip 'dist/*'
          test -f dist/index.html
          test "$(find dist/audio -name '*.mp3' | wc -l)" -eq 164
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
